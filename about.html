<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>À propos</title>
    <link rel="stylesheet" href="css/style.css">
    <script>
        (function () {
            const theme = localStorage.getItem("theme") || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
            document.documentElement.setAttribute("data-theme", theme);
        })();
    </script>
</head>
<body>

    <header>
        <h1>À propos de nous</h1>
        <nav>
            <a href="index.html">Accueil</a>
            <a href="about.html">À propos</a>
            <button id="theme-toggle" type="button">🌙 Mode sombre</button>
        </nav>
    </header>

    <main>
        <section>
            <h2>Qui sommes-nous ?</h2>
            <p>Nous sommes une équipe passionnée par le développement Web.</p>
            <p>Notre objectif est de créer des sites Web simples et efficaces.</p>
        </section>
    </main>

    <footer>
        <p>Mon Site Vitrine</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
